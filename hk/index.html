<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: full-bleed top-down car park canvas; signage-style HUD strip on top; wheel + gear + pedals overlaid at the bottom */
:root{
  --bg:#0d0f11;
  --panel:#16191c;
  --line:#2c3035;
  --ink:#ece7da;
  --muted:#8e939a;
  --paint:#f2c53d;
  --stop:#e5493e;
  --go:#58c482;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--paint);outline-offset:2px}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--bg) 60%,transparent);pointer-events:none}
#hud > *{pointer-events:auto}
.floor{display:flex;align-items:center;gap:8px;min-width:0}
.floor b{font-family:var(--f-mono);font-weight:600;background:var(--paint);color:#14120c;padding:2px 7px;border-radius:3px;font-size:15px}
.floor span{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:12px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats em{font-style:normal;color:var(--ink)}
.stats .bad em{color:var(--stop)}
.tools{margin-left:auto;display:flex;gap:6px}
.tools button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;font-weight:700}
#sensors{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none;font-family:var(--f-mono);font-size:12px}
.sens{background:rgba(13,15,17,.82);border:1px solid var(--line);border-radius:4px;padding:3px 8px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.sens i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#hint{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;background:var(--paint);color:#14120c;font-weight:900;padding:6px 14px;border-radius:4px;font-size:14px;white-space:nowrap}

/* Controls */
#controls{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding-block:0 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#controls > *{pointer-events:auto}
.wheelbox{display:flex;flex-direction:column;align-items:center;gap:6px}
#wheel{width:132px;height:132px;border-radius:50%;touch-action:none;position:relative}
#wheel svg{width:100%;height:100%;display:block}
.wheelrow{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wheelrow button{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-size:12px;font-weight:700}
.rightctl{display:flex;gap:10px;align-items:flex-end}
.gears{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px}
.gears button{width:40px;height:32px;border:0;border-radius:5px;background:transparent;font-family:var(--f-mono);font-weight:600;font-size:16px;color:var(--muted)}
.gears button.on{background:var(--paint);color:#14120c}
.gears button.on[data-g="R"]{background:var(--stop);color:#fff}
.pedal{border:1px solid var(--line);border-radius:10px;background:repeating-linear-gradient(0deg,#22262a 0 6px,#1a1d20 6px 10px);touch-action:none;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-weight:900;font-size:14px;color:var(--muted)}
#brake{width:66px;height:86px}
#gas{width:54px;height:112px}
.pedal.on{border-color:var(--paint);color:var(--ink);background:repeating-linear-gradient(0deg,#3a3420 0 6px,#2a261a 6px 10px)}
#brake.on{border-color:var(--stop)}
@media (orientation:landscape) and (max-height:520px){
  #wheel{width:112px;height:112px}
  #gas{height:96px}#brake{height:74px}
}

#flash{position:absolute;inset:0;background:var(--stop);opacity:0;pointer-events:none}
#rearcam{position:absolute;border:2px solid var(--line);border-radius:6px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#rearcam span{position:absolute;left:6px;top:4px;font-size:11px;font-weight:700;background:rgba(13,15,17,.75);padding:1px 6px;border-radius:3px}
/* Overlays */
.overlay{position:absolute;inset:0;background:rgba(9,10,12,.86);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;z-index:5}
.card{width:100%;max-width:560px;display:flex;flex-direction:column;gap:18px;margin:auto}
.brand{display:flex;flex-direction:column;gap:6px}
.brand .stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--paint) 0 12px,#111 12px 24px);border-radius:2px}
.brand h1{margin:0;font-weight:900;font-size:clamp(40px,11vw,68px);letter-spacing:.04em;line-height:1.05;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lv{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.lv:hover:not(:disabled){border-color:var(--paint)}
.lv:disabled{opacity:.4;cursor:not-allowed}
.lv .code{font-family:var(--f-mono);font-weight:600;font-size:22px;color:var(--paint)}
.lv .nm{font-weight:700;font-size:15px}
.lv .st{font-size:14px;letter-spacing:2px;color:var(--paint)}
.lv .st s{text-decoration:none;color:var(--line)}
.help{font-size:13px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
.help kbd{font-family:var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--ink);font-size:12px}
.result h2{margin:0;font-size:40px;font-weight:900}
.result .big{font-size:40px;letter-spacing:6px;color:var(--paint)}
.result .big s{text-decoration:none;color:var(--line)}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
.result dt{color:var(--muted)}
.result dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:6px;padding:12px 18px;font-weight:900;font-size:16px;background:var(--paint);color:#14120c}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.tipline{background:var(--panel);border-left:4px solid var(--paint);padding:10px 12px;font-size:14px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="floor"><b id="lvCode">B1</b><span id="lvName">午夜地庫</span></div>
    <div class="stats">
      <span>時間 <em id="tTime">0.0</em>s</span>
      <span id="hitWrap">花痕 <em id="tHits">0</em>/5</span>
      <span><em id="tSpd">0</em> km/h</span>
    </div>
    <div class="tools">
      <button id="bCam" title="切換鏡頭">鏡頭：俯視</button>
      <button id="bSnd" title="雷達聲">聲 開</button>
      <button id="bRetry" title="重新開始">重來</button>
      <button id="bMenu" title="選擇樓層">選關</button>
    </div>
  </div>
  <div id="sensors"><div class="sens"><i id="sF"></i>車頭 <span id="dF">--</span></div><div class="sens"><i id="sR"></i>車尾 <span id="dR">--</span></div></div>
  <div id="hint" hidden></div>

  <div id="controls">
    <div class="wheelbox">
      <div id="wheel" aria-label="軚盤">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#2b2f34" stroke-width="10"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="#3b4046" stroke-width="2"/>
          <rect x="47" y="2" width="6" height="12" rx="2" fill="#f2c53d"/>
          <path d="M8 54 Q50 40 92 54" fill="none" stroke="#2b2f34" stroke-width="9"/>
          <path d="M50 52 L50 92" stroke="#2b2f34" stroke-width="9"/>
          <circle cx="50" cy="52" r="13" fill="#1d2024" stroke="#3b4046" stroke-width="2"/>
        </svg>
      </div>
      <div class="wheelrow"><span id="tWheel">軚 0°</span><button id="bCenter">回正</button></div>
    </div>
    <div class="rightctl">
      <div class="gears" id="gears">
        <button data-g="P" class="on">P</button>
        <button data-g="R">R</button>
        <button data-g="N">N</button>
        <button data-g="D">D</button>
      </div>
      <div class="pedal" id="brake">煞車</div>
      <div class="pedal" id="gas">油</div>
    </div>
  </div>

  <div id="flash"></div>
  <div id="rearcam" hidden><span>倒車鏡頭</span></div>
  <div class="overlay" id="ov"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

(() => {
'use strict';
// ---------- constants (meters, seconds) ----------
const WB = 2.7, CAR_L = 4.6, CAR_W = 1.8, AX = 1.35;
const MAXS = 35 * Math.PI / 180, LOCK = 540, CREEP = 0.55, MAX_HITS = 5;
const PI = Math.PI;

// ---------- level builders ----------
const R = (x, y, w, h, t = 'wall', extra) => Object.assign({ x, y, w, h, t }, extra || {});
const border = (W, H) => { const t = .5; return [R(0,0,W,t), R(0,H-t,W,t), R(0,0,t,H), R(W-t,0,t,H)]; };
const row = (x0, y0, w, h, n, m) => Array.from({ length: n }, (_, i) => ({ x: x0 + i * w, y: y0, w, h, m }));
function parkIn(s, seed, wmax = 1.84) {
  const L = 4.5;
  if (s.m !== 'P') { const w = Math.min(wmax, s.w - 0.42); return R(s.x + (s.w - w) / 2, s.y + (s.h - L) / 2, w, L, 'car', { seed }); }
  const h = Math.min(wmax, s.h - 0.4); return R(s.x + (s.w - L) / 2, s.y + (s.h - h) / 2, L, h, 'car', { seed });
}
const fill = (obs, slots, idx, base, w) => idx.forEach(i => obs.push(parkIn(slots[i], base + i, w)));

const LEVELS = [
  () => { const W = 22.5, H = 17.5, top = row(1,.5,2.6,5,8,'S'), bot = row(1,12,2.6,5,8,'N');
    const obs = border(W, H); fill(obs, top, [0,1,2,3,5,6], 1); fill(obs, bot, [0,1,3,4,5,7], 20);
    return { code:'B1', name:'午夜地庫', W, H, slots:[...top,...bot], target: top[4], obs, start:{x:3.5,y:8.75,a:0}, needA:null, par:45,
      tip:'熱身：沿車路開，打軚車頭直入亮咗嘅車位。車位 2.6 米闊，6.5 米車路，算闊落。', arrows:[[11,8.75,0]] }; },
  () => { const W = 24, H = 17.5, top = row(1,.5,2.5,5,9,'S'), bot = row(1,12,2.5,5,9,'N');
    const obs = border(W, H); fill(obs, top, [0,1,2,3,4,6,7,8], 3); fill(obs, bot, [0,2,3,4,6,7,8], 30);
    return { code:'B2', name:'倒泊入格', W, H, slots:[...top,...bot], target: top[5], obs, start:{x:4.5,y:8.75,a:0}, needA: PI/2, par:60,
      tip:'要車頭向外。先開過車位，掛 R 倒入，跟住後面嗰兩條輔助線。', arrows:[[11,8.75,0]] }; },
  () => { const W = 22, H = 16.5, top = row(1,.5,2.5,5,8,'S'), bot = row(1,11,2.5,5,8,'N');
    const obs = border(W, H); obs.push(R(21,.5,.5,5));
    obs.push(R(8.2,4.5,.6,.6,'pillar'), R(15.7,4.5,.6,.6,'pillar'), R(5.7,10.9,.6,.6,'pillar'), R(13.2,10.9,.6,.6,'pillar'));
    fill(obs, top, [0,1,2,4,5,6,7], 5); fill(obs, bot, [1,2,3,5,6,7], 40);
    return { code:'B3', name:'柱位夾縫', W, H, slots:[...top,...bot], target: top[3], obs, start:{x:3,y:8.25,a:0}, needA:null, par:60,
      tip:'車位口左邊有條柱食咗 30 厘米。入位要貼右，車身全部喺白線入面先算。', arrows:[[12,8.25,0]] }; },
  () => { const W = 26, H = 10.5;
    const slots = [{x:1,y:1,w:5.6,h:2.4,m:'P'},{x:6.6,y:1,w:5.6,h:2.4,m:'P'},{x:12.2,y:1,w:6.2,h:2.4,m:'P'},{x:18.4,y:1,w:5.6,h:2.4,m:'P'}];
    const obs = border(W, H); obs.push(R(.5,.5,25,.5,'kerb'), R(.5,9.3,25,.7,'kerb'));
    fill(obs, slots, [0,1,3], 7);
    return { code:'B4', name:'路邊平排', W, H, slots, target: slots[2], obs, start:{x:4,y:6.4,a:0}, needA:null, par:70,
      tip:'平排泊車：開到同前車並排，掛 R 打盡軚倒入，車尾入咗一半就回軚再反方向打。', arrows:[] }; },
  () => { const W = 24, H = 18, top = row(6.5,2,2.5,5,6,'S');
    const obs = border(W, H);
    obs.push(R(.5,.5,5.5,6.5), R(6,.5,17.5,1.5), R(6,2,.5,5), R(21.5,2,2,5), R(5,11.5,18.5,6));
    fill(obs, top, [0,1,2,3,5], 9);
    return { code:'B5', name:'工廈窄彎', W, H, slots: top, target: top[4], obs, start:{x:2.75,y:15,a:-PI/2}, needA:null, par:80,
      tip:'4.5 米窄車路加 90 度彎。轉彎前靠外行，唔夠位就前後搓幾次。', arrows:[[2.75,9.5,-PI/2],[11,9.25,0]], mirror:[5.15,11.35] }; },
  () => { const W = 20, H = 13, top = row(1,.5,2.3,5,8,'S');
    const obs = border(W, H); obs.push(R(.5,11,19,1.5));
    obs.push(R(7.65,4.5,.5,.6,'pillar'), R(4.4,10.4,.6,.6,'pillar'), R(11.4,10.4,.6,.6,'pillar'), R(16,10.4,.6,.6,'pillar'));
    fill(obs, top, [0,1,2,4,5,6,7], 11, 1.78);
    return { code:'B6', name:'地獄格', W, H, slots: top, target: top[3], obs, start:{x:3,y:8,a:0}, needA: PI/2, par:100,
      tip:'2.3 米窄格、柱位、5.5 米車路，仲要倒泊車頭向外。慢慢嚟，一寸一寸搓。', arrows:[] }; },
];

// ---------- state ----------
const $ = id => document.getElementById(id);
const cv = $('cv');
let lvIdx = 0, L = null, car = null, mode = 'menu';
let gear = 'P', wheel = 0, gas = false, brake = false;
let tElapsed = 0, started = false, hits = 0, contact = false, holdT = 0, shake = 0, flash = 0;
let camMode = 'top', soundOn = true, lookYaw = 0, lookDrag = false;
const keys = {};
let progress = {};
try { progress = JSON.parse(localStorage.getItem('zwp-progress') || '{}') || {}; } catch (e) { progress = {}; }
const saveProgress = () => { try { localStorage.setItem('zwp-progress', JSON.stringify(progress)); } catch (e) {} };

function loadLevel(i) {
  lvIdx = i; L = LEVELS[i]();
  car = { x: L.start.x, y: L.start.y, a: L.start.a, v: 0 };
  gear = 'P'; wheel = 0; gas = brake = false; tElapsed = 0; started = false; hits = 0; contact = false; holdT = 0; shake = 0; flash = 0; lookYaw = 0;
  $('lvCode').textContent = L.code; $('lvName').textContent = L.name;
  setGearUI(); mode = 'play'; $('ov').hidden = true;
  buildWorld(); layout(); snapCam = true;
}

// ---------- three.js setup ----------
const T = THREE;
const renderer = new T.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.autoClear = true;
const scene = new T.Scene();
scene.background = new T.Color('#0d0f11');
const camera = new T.PerspectiveCamera(40, 1, .05, 200);
const rearCam = new T.PerspectiveCamera(95, 1.6, .05, 60);
scene.add(new T.HemisphereLight(0xdfe6ee, 0x2a2622, .55));
const sun = new T.DirectionalLight(0xffffff, .55);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 60 });
scene.add(sun); scene.add(sun.target);

const Mt = (c, r = .6, m = 0, e) => new T.MeshStandardMaterial({ color: c, roughness: r, metalness: m, emissive: e || 0x000000 });
function bx(w, h, d, m, x, y, z, parent) { const b = new T.Mesh(new T.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = true; b.receiveShadow = true; parent.add(b); return b; }
function beam(p1, p2, t, m, parent) {
  const a = new T.Vector3(...p1), b = new T.Vector3(...p2), len = a.distanceTo(b);
  const mesh = new T.Mesh(new T.BoxGeometry(t, t, len), m); mesh.position.copy(a).add(b).multiplyScalar(.5); mesh.lookAt(b); parent.add(mesh); return mesh;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 8; return t;

function aimMirror(m, px, py, pz, tx, ty, tz) { m.cam.position.set(px, py, pz); m.cam.lookAt(tx, ty, tz); }
function drawMirrors(list, w, h) {
  for (const m of list) { renderer.setRenderTarget(m.rt); renderer.clear(); renderer.render(scene, m.cam); }
  renderer.setRenderTarget(null); renderer.setViewport(0, 0, w, h);
  mirrorScene.children.forEach(o => o.visible = false);
  list.forEach(m => { m.frame.visible = m.glass.visible = true; });
  mirrorCam.left = 0; mirrorCam.right = w; mirrorCam.top = 0; mirrorCam.bottom = -h; mirrorCam.updateProjectionMatrix();
  renderer.autoClear = false; renderer.clearDepth(); renderer.render(mirrorScene, mirrorCam); renderer.autoClear = true;
}
const mirC = makeMirror(20, 3.4), mirL = makeMirror(26, 1.5), mirR = makeMirror(26, 1.5);
// ---------- camera / layout ----------
let availTop = 0, availBot = 0, snapCam = true, rearRect = null;
const camPos = new T.Vector3(), camLook = new T.Vector3();
function layout() {
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
  const app = $('app').getBoundingClientRect();
  const hb = $('hud').getBoundingClientRect().bottom - app.top;
  const ct = $('controls').getBoundingClientRect().top - app.top;
  availTop = hb + 30;
  availBot = (w > h * 1.15) ? h - 8 : ct - 6;
  if (availBot - availTop < 160) { availTop = hb; availBot = h; }
  $('sensors').style.top = (hb + 2) + 'px';
  $('hint').style.top = (availBot - 40) + 'px';
  const iw = Math.min(240, w * .42), ih = iw * .62;
  rearRect = camMode === 'pov' ? { x: (w - iw) / 2, y: Math.max(hb + 120, availBot - ih - 70), w: iw, h: ih } : { x: w - iw - 16, y: hb + 34, w: iw, h: ih };
  { // driver's mirrors: rear-view at the top of the windshield (left of centre for right-hand drive), wing mirrors at both sides
    const cw = Math.min(300, w * .5), ch = cw * .3; placeMirror(mirC, w / 2 - cw / 2 - w * .06, hb + 32, cw, ch, 4);
    const sw = Math.min(170, w * .3), sh = sw * .66, my = availTop + (availBot - availTop) * .42;
    placeMirror(mirL, 10, my, sw, sh, 4); placeMirror(mirR, w - sw * 1.1 - 10, my - sh * .05, sw * 1.1, sh * 1.1, 4);
  }
  const rc = $('rearcam'); Object.assign(rc.style, { left: rearRect.x + 'px', top: rearRect.y + 'px', width: iw + 'px', height: ih + 'px' });
  rearCam.aspect = iw / ih; rearCam.updateProjectionMatrix();
  if (camMode === 'pov') { camera.fov = povFov(); camera.updateProjectionMatrix(); }
}
function applyCamVis() {
  if (ceilingGroup) ceilingGroup.visible = camMode === 'pov';
  camera.fov = camMode === 'pov' ? povFov() : camMode === 'chase' ? 55 : 40; camera.updateProjectionMatrix();
  $('bCam').textContent = '鏡頭：' + { top: '俯視', chase: '追蹤', pov: '司機' }[camMode];
  snapCam = true;
}
function povFov() { const a = camera.aspect || 1; return Math.min(80, Math.max(62, 2 * Math.atan(Math.tan(41 * PI / 180) / a) * 180 / PI)); }
function toggleCam() { camMode = { top: 'chase', chase: 'pov', pov: 'top' }[camMode]; lookYaw = 0; applyCamVis(); layout(); }
function updateCamera(dt) {
  const c = Math.cos(car.a), s = Math.sin(car.a);
  let want, look, k = snapCam ? 1 : 1 - Math.exp(-dt * 5);
  if (camMode === 'top') {
    const w = cv.clientWidth, h = cv.clientHeight, ah = availBot - availTop;
    const fit = Math.min((w - 16) / L.W, ah / L.H) * .97, tn = Math.tan(camera.fov * PI / 360);
    const height = h / (2 * fit * tn), offY = (availTop + ah / 2 - h / 2) / fit;
    want = new T.Vector3(L.W / 2, height, L.H / 2 - offY); look = new T.Vector3(L.W / 2, 0, L.H / 2 - offY - .001);
    camera.up.set(0, 0, -1);
  } else if (camMode === 'chase') {
    const asp = camera.aspect, kk = Math.max(1, Math.min(1.8, 1 / asp));
    want = new T.Vector3(car.x - c * 7 * kk, 5.2 * kk, car.y - s * 7 * kk); look = new T.Vector3(car.x + c * 2.5, .4, car.y + s * 2.5);
    camera.up.set(0, 1, 0);
  } else {
    const ex = car.x - c * .15 - s * .38, ez = car.y - s * .15 + c * .38, yaw = car.a + lookYaw;
    want = new T.Vector3(ex, 1.24, ez); look = new T.Vector3(ex + Math.cos(yaw) * 10, .55, ez + Math.sin(yaw) * 10);
    camera.up.set(0, 1, 0); k = 1;
    if (!lookDrag) lookYaw *= Math.max(0, 1 - dt * 2.5);
  }
  camPos.lerp(want, k); camLook.lerp(look, k); snapCam = false;
  let sx = 0, sz = 0; if (shake > 0) { sx = (Math.random() - .5) * .25 * shake; sz = (Math.random() - .5) * .25 * shake; }
  camera.position.set(camPos.x + sx, camPos.y, camPos.z + sz); camera.lookAt(camLook);
  // rear camera on the boot lid
  rearCam.position.set(car.x - c * 2.25, 1.05, car.y - s * 2.25);
  rearCam.lookAt(car.x - c * 6, -.6, car.y - s * 6);
  const fc = camMode === 'top' ? new T.Vector3(L.W / 2, 0, L.H / 2) : new T.Vector3(car.x, 0, car.y);
  sun.position.set(fc.x - 5, 22, fc.z + 6); sun.target.position.copy(fc);
}
function render(now, dt) {
  if (!L) { renderer.render(scene, camera); return; }
  const pc = playerCar, d = wheel / LOCK * MAXS;
  pc.root.position.set(car.x, 0, car.y); pc.root.rotation.y = -car.a;
  pc.fronts.forEach(f => f.rotation.y = -d);
  if (pc.wheelSpin) pc.wheelSpin.rotation.z = -wheel * PI / 180;
  const braking = brake || keys.Space || keys.ArrowDown || keys.KeyS;
  pc.tails.forEach(t => t.material = gear === 'R' ? headM : braking ? brakeM : tailM);
  const st = mode === 'play' ? inTarget() : 'out';
  targetMesh.material.color.set(st === 'in' ? 0x58c482 : 0xf2c53d);
  targetMesh.material.opacity = st === 'in' ? .5 : .16 + .12 * Math.sin(now / 260);
  updateGuides(); updateCamera(dt);
  renderer.setScissorTest(false);
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setViewport(0, 0, w, h);
  renderer.render(scene, camera);
  const showRear = gear === 'R' && camMode !== 'top' && mode === 'play';
  $('rearcam').hidden = !showRear;
  if (showRear && rearRect) {
    const r = rearRect, y = h - r.y - r.h;
    renderer.setScissorTest(true); renderer.setScissor(r.x, y, r.w, r.h); renderer.setViewport(r.x, y, r.w, r.h);
    pc.root.visible = false; renderer.render(scene, rearCam); pc.root.visible = true;
    renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h);
  }
  if (camMode === 'pov' && mode === 'play') {
    const c = Math.cos(car.a), s = Math.sin(car.a), lx = -s, lz = c;   // l = car's right-hand side
    const at = (fx, rx, y) => [car.x + c * fx + lx * rx, y, car.y + s * fx + lz * rx];
    let p = at(.35, .05, 1.34), t = at(-10, .05, .9); aimMirror(mirC, ...p, ...t);
    p = at(.85, -1.02, 1.0); t = at(-10, -2.6, .4); aimMirror(mirL, ...p, ...t);
    p = at(.85, 1.02, 1.0); t = at(-10, 2.6, .4); aimMirror(mirR, ...p, ...t);
    drawMirrors([mirC, mirL, mirR], w, h);
  }
  $('flash').style.opacity = flash > 0 ? (flash * .3).toFixed(3) : '0';
}

// ---------- HUD ----------
function sensColor(d) { return d < .3 ? 'var(--stop)' : d < .8 ? '#f29a3d' : d < 1.5 ? 'var(--paint)' : 'var(--muted)'; }
function updateHUD(dt) {
  $('tTime').textContent = tElapsed.toFixed(1);
  $('tHits').textContent = hits; $('hitWrap').classList.toggle('bad', hits > 0);
  $('tSpd').textContent = (Math.abs(car.v) * 3.6).toFixed(0);
  $('tWheel').textContent = '軚 ' + (wheel > 0 ? '+' : '') + Math.round(wheel) + '°';
  $('wheel').style.transform = `rotate(${wheel}deg)`;
  const f = sensor(true), r = sensor(false);
  $('dF').textContent = f < 1.5 ? f.toFixed(2) + 'm' : '--'; $('sF').style.background = sensColor(f);
  $('dR').textContent = r < 1.5 ? r.toFixed(2) + 'm' : '--'; $('sR').style.background = sensColor(r);
  $('gas').classList.toggle('on', !!(gas || keys.ArrowUp || keys.KeyW));
  $('brake').classList.toggle('on', !!(brake || keys.ArrowDown || keys.KeyS || keys.Space));
  // parking radar beep
  const dist = gear === 'R' ? r : gear === 'D' ? f : 9;
  beepT -= dt;
  if (dist < 1.5 && beepT <= 0) { beep(dist < .3 ? 1250 : 980, dist < .3 ? .12 : .06); beepT = dist < .3 ? .1 : .08 + (dist - .3) * .45; }
  const st = inTarget(), h = $('hint');
  if (st === 'in') { h.hidden = false; h.textContent = Math.abs(car.v) < .05 ? '已入位，停定…' : '已入位，煞停佢'; }
  else if (st === 'dir') { h.hidden = false; h.textContent = '入咗位，但車頭要向外'; }
  else if (!started) { h.hidden = false; h.textContent = '掛 D 或 R 波開始'; }
  else h.hidden = true;
}

// ---------- end states ----------
const stars = n => '★'.repeat(n) + '<s>' + '★'.repeat(3 - n) + '</s>';
function endWin() {
  mode = 'clear'; beep(880, .12, .08); setTimeout(() => beep(1320, .2, .08), 130);
  const n = hits === 0 && tElapsed <= L.par ? 3 : hits <= 1 ? 2 : 1;
  progress[L.code] = Math.max(progress[L.code] || 0, n); saveProgress();
  const next = lvIdx + 1 < LEVELS.length;
  showOverlay(`<div class="card result">
    <h2>泊好！</h2><div class="big">${stars(n)}</div>
    <dl><dt>樓層</dt><dd>${L.code} ${L.name}</dd><dt>時間</dt><dd>${tElapsed.toFixed(1)} s（標準 ${L.par} s）</dd><dt>花痕</dt><dd>${hits}</dd></dl>
    <p class="help" style="margin:0">三星：零花痕兼喺標準時間內。兩星：最多一下花。</p>
    <div class="btns">${next ? '<button class="btn" data-act="next">落一層</button>' : ''}<button class="btn ${next ? 'ghost' : ''}" data-act="retry">再泊一次</button><button class="btn ghost" data-act="menu">選關</button></div>
  </div>`);
}
function endFail() {
  mode = 'fail';
  showOverlay(`<div class="card result">
    <h2>車身花晒</h2>
    <p class="tipline">撞咗 ${MAX_HITS} 下。試下開近鏡、慢慢搓，靠車頭車尾雷達同倒車輔助線。</p>
    <div class="btns"><button class="btn" data-act="retry">再試</button><button class="btn ghost" data-act="menu">選關</button></div>
  </div>`);
}
function showMenu() {
  mode = 'menu';
  const cards = LEVELS.map((f, i) => {
    const lv = f(), best = progress[lv.code] || 0, open = i === 0 || progress[LEVELS[i-1]().code];
    return `<button class="lv" data-lv="${i}" ${open ? '' : 'disabled'}><span class="code">${lv.code}</span><span class="nm">${lv.name}</span><span class="st">${open ? stars(best) : '未解鎖'}</span></button>`;
  }).join('');
  showOverlay(`<div class="card">
    <div class="brand"><div class="stripe"></div><h1>窄位泊車王</h1><p>香港式地庫窄位，右軚車，自動波。由 B1 一路落到 B6 地獄格，車身要全部入晒白線先算泊好。</p></div>
    <div class="levels">${cards}</div>
    <div class="help">鏡頭有三個：俯視、追蹤、司機視角（坐喺右軚位睇出去，入 R 波會出倒車鏡頭）。<br>手機：左下軚盤用手指轉（左右各一圈半），右下揀 P R N D 波、踩煞車同油。放開煞車車會慢慢蠕動，好似真自動波。<br>
    <a href="../" style="color:var(--paint);font-weight:700;text-decoration:none">← 返主頁揀香港／台灣</a><br>鍵盤：<kbd>←</kbd><kbd>→</kbd> 扭軚、<kbd>C</kbd> 回正、<kbd>↑</kbd> 油、<kbd>↓</kbd>/<kbd>空格</kbd> 煞車、<kbd>Q</kbd> 換 R、<kbd>E</kbd> 換 D、<kbd>F</kbd> 泊 P、<kbd>R</kbd> 重試、<kbd>V</kbd> 換鏡頭（俯視／追蹤／司機視角，司機視角可以拖畫面四圍望）。</div>
  </div>`);
}
function showIntro() {
  showOverlay(`<div class="card result">
    <div class="brand"><div class="stripe"></div></div>
    <h2>${L.code} ${L.name}</h2>
    <p class="tipline">${L.tip}</p>
    <div class="btns"><button class="btn" data-act="go">開車</button><button class="btn ghost" data-act="menu">選關</button></div>
  </div>`);
  mode = 'intro';
}
function showOverlay(html) { const o = $('ov'); o.innerHTML = html; o.hidden = false; }
$('ov').addEventListener('click', e => {
  audio();
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lv != null) { loadLevel(+b.dataset.lv); showIntro(); return; }
  const act = b.dataset.act;
  if (act === 'go') { $('ov').hidden = true; mode = 'play'; }
  if (act === 'retry') { loadLevel(lvIdx); }
  if (act === 'next') { loadLevel(lvIdx + 1); showIntro(); }
  if (act === 'menu') showMenu();
});

// ---------- input ----------
function setWheel(v) { wheel = Math.max(-LOCK, Math.min(LOCK, v)); }
function setGear(g) {
  if (g === gear) return;
  if (g !== 'N' && Math.abs(car.v) > .3) { beep(220, .15); return; }
  gear = g; setGearUI(); beep(g === 'R' ? 660 : 520, .04, .04);
}
function setGearUI() { document.querySelectorAll('#gears button').forEach(b => b.classList.toggle('on', b.dataset.g === gear)); }
document.querySelectorAll('#gears button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); setGear(b.dataset.g); }));
function pedal(el, set) {
  const on = e => { e.preventDefault(); audio(); el.setPointerCapture?.(e.pointerId); set(true); };
  const off = () => set(false);
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
}
pedal($('gas'), v => gas = v); pedal($('brake'), v => brake = v);
{ // steering wheel drag
  const el = $('wheel'); let last = null, pid = null;
  const ang = e => { const r = el.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2)) * 180 / PI; };
  el.addEventListener('pointerdown', e => { e.preventDefault(); audio(); pid = e.pointerId; el.setPointerCapture(pid); last = ang(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId !== pid || last == null) return; const a = ang(e); let d = a - last; if (d > 180) d -= 360; if (d < -180) d += 360; setWheel(wheel + d); last = a; });
  const end = () => { last = null; pid = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
$('bCenter').addEventListener('click', () => setWheel(0));
$('bCam').addEventListener('click', () => toggleCam());
$('bSnd').addEventListener('click', () => { soundOn = !soundOn; $('bSnd').textContent = soundOn ? '聲 開' : '聲 關'; });
$('bRetry').addEventListener('click', () => { if (L) loadLevel(lvIdx); });
$('bMenu').addEventListener('click', showMenu);
window.addEventListener('keydown', e => {
  audio();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (mode !== 'play') return;
  if (e.code === 'KeyQ') setGear('R'); if (e.code === 'KeyE') setGear('D'); if (e.code === 'KeyF') setGear('P'); if (e.code === 'KeyN') setGear('N');
  if (e.code === 'KeyC') setWheel(0); if (e.code === 'KeyV') toggleCam(); if (e.code === 'KeyR') loadLevel(lvIdx);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; gas = brake = false; });
window.addEventListener('resize', layout);

// ---------- loop ----------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (L && mode === 'play') {
    const n = 4; for (let i = 0; i < n && mode === 'play'; i++) step(dt / n);
    if (started) tElapsed += dt;
    if (mode === 'play') {
      updateHUD(dt);
      if (inTarget() === 'in' && Math.abs(car.v) < .05) { holdT += dt; if (holdT > 1) endWin(); } else holdT = 0;
    }
  }
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt * 1.6);
  render(now, dt);
  requestAnimationFrame(frame);
}
{ // drag on the 3D view to look around from the driver's seat
  let pid = null, lx = 0;
  cv.addEventListener('pointerdown', e => { if (camMode !== 'pov') return; pid = e.pointerId; lx = e.clientX; lookDrag = true; cv.setPointerCapture(pid); });
  cv.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; lookYaw = Math.max(-2.6, Math.min(2.6, lookYaw + (e.clientX - lx) * .008)); lx = e.clientX; });
  const end = () => { pid = null; lookDrag = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
const boot = () => { loadLevel(0); showMenu(); layout(); requestAnimationFrame(frame); };
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(boot);
})();
</script>
</body>
</html>
