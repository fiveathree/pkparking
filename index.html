<style>
/* Layout: one screen; title strip on top, two game doors side by side (stacked on phones) */
:root{
  --bg:#0b0d12; --panel:#151922; --line:#2a3040; --ink:#f1ede4; --muted:#8f95a3;
  --hk:#f2c53d; --tw:#3fd1a8;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-display);overflow:hidden}
main{height:100%;display:flex;flex-direction:column;gap:14px;max-width:1100px;margin:0 auto;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{margin:0;font-weight:900;font-size:clamp(32px,8vw,52px);line-height:1;letter-spacing:.03em}
header p{margin:0;color:var(--muted);font-size:15px}
.doors{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-aspect-ratio:4/5){.doors{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.door{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.door:hover,.door:focus-visible{transform:translateY(-2px);outline:none}
.door.hk:hover,.door.hk:focus-visible{border-color:var(--hk)}
.door.tw:hover,.door.tw:focus-visible{border-color:var(--tw)}
.pic{flex:1;min-height:0;background-size:cover;background-position:center}
.hk .pic{background-image:url(hk/thumb.jpg)}
.tw .pic{background-image:url(tw/thumb.jpg)}
.info{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.tag{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:2px 8px;border-radius:3px;color:#111}
.hk .tag{background:var(--hk)} .tw .tag{background:var(--tw)}
.txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.txt b{font-size:19px;font-weight:900}
.txt span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{font-weight:900;font-size:15px;padding:9px 14px;border-radius:6px;color:#111}
.hk .go{background:var(--hk)} .tw .go{background:var(--tw)}
@media (prefers-reduced-motion:reduce){.door{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>泊車地獄</h1>
    <p>香港定台灣？揀一個開始。</p>
  </header>
  <div class="doors">
    <a class="door hk" href="hk/">
      <div class="pic" role="img" aria-label="香港地庫窄位泊車"></div>
      <div class="info">
        <span class="tag">香港</span>
        <div class="txt"><b>窄位泊車王</b><span>地庫窄位 · 右軚汽車 · B1 至 B6</span></div>
        <span class="go">開始</span>
      </div>
    </a>
    <a class="door tw" href="tw/">
      <div class="pic" role="img" aria-label="台灣騎樓機車格"></div>
      <div class="info">
        <span class="tag">台灣</span>
        <div class="txt"><b>機車格地獄</b><span>3D 騎樓機車格 · 腳踩倒後 · 手推移車</span></div>
        <span class="go">開始</span>
      </div>
    </a>
  </div>
</main>
</body>
</html>
