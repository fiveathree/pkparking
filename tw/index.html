<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
.xlink{color:var(--ok);font-weight:700;text-decoration:none}
/* Layout: full-bleed 3D street; slim signage HUD on top; joystick bottom-left, action buttons bottom-right */
:root{
  --bg:#0b0d14;
  --panel:#151925;
  --line:#2a3042;
  --ink:#f1ede4;
  --muted:#8f95a3;
  --sign:#ff6a3d;
  --ok:#3fd1a8;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}

#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(11,13,20,.92) 55%,transparent);pointer-events:none}
#hud > *{pointer-events:auto}
.lvl{display:flex;align-items:center;gap:8px;min-width:0}
.lvl b{font-family:var(--f-mono);font-weight:600;background:var(--sign);color:#1a0d07;padding:2px 7px;border-radius:3px;font-size:14px}
.lvl span{font-weight:900;font-size:15px;white-space:nowrap}
.stats{display:flex;gap:12px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats em{font-style:normal;color:var(--ink)}
.stats .bad em{color:var(--sign)}
.tools{margin-left:auto;display:flex;gap:6px}
.tools button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;font-weight:700}
#chip{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;pointer-events:none;white-space:nowrap}
#hint{position:absolute;left:50%;transform:translateX(-50%);max-width:min(92vw,520px);text-align:center;background:rgba(11,13,20,.82);border:1px solid var(--line);
  border-radius:6px;padding:6px 12px;font-size:13px;line-height:1.5;pointer-events:none}
#hint.good{background:var(--ok);color:#06231b;border-color:var(--ok);font-weight:900}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:var(--sign);color:#1a0d07;font-weight:900;font-size:20px;padding:8px 18px;border-radius:4px;pointer-events:none}

#controls{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding-block:0 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#controls > *{pointer-events:auto}
#joy{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,rgba(21,25,37,.75) 60%,rgba(42,48,66,.9) 61%,rgba(21,25,37,.75) 64%);
  border:1px solid var(--line);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#2a3042;border:2px solid #4a5370;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.acts{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.act{min-width:112px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:900;font-size:17px;touch-action:none}
.act.main{background:var(--ok);color:#06231b;border-color:var(--ok)}
.act.push{background:var(--sign);color:#1a0d07;border-color:var(--sign)}
.act:disabled{opacity:.35;cursor:not-allowed;background:var(--panel);color:var(--muted);border-color:var(--line)}
@media (orientation:landscape) and (max-height:520px){#joy{width:110px;height:110px}.act{padding:10px 14px;font-size:15px}}

.overlay{position:absolute;inset:0;z-index:5;background:rgba(7,8,13,.86);backdrop-filter:blur(4px);display:flex;overflow:auto;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:580px;margin:auto;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;flex-direction:column;gap:8px}
.brand .slots{height:14px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 34px);border-top:3px solid var(--ink);opacity:.85}
.brand h1{margin:0;font-weight:900;font-size:clamp(42px,12vw,72px);line-height:1;letter-spacing:.02em}
.brand h1 i{font-style:normal;color:var(--sign)}
.brand p{margin:0;color:var(--muted);font-size:15px;line-height:1.6;max-width:36em}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.lv{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.lv:hover:not(:disabled){border-color:var(--ok)}
.lv:disabled{opacity:.4;cursor:not-allowed}
.lv .no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lv .nm{font-weight:900;font-size:17px}
.lv .st{color:var(--ok);letter-spacing:2px;font-size:14px}
.lv .st s,.big s{text-decoration:none;color:var(--line)}
.help{font-size:13px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
.help kbd{font-family:var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--ink);font-size:12px}
.res h2{margin:0;font-size:38px;font-weight:900}
.big{font-size:40px;letter-spacing:6px;color:var(--ok)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
dt{color:var(--muted)} dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tip{background:var(--panel);border-left:4px solid var(--sign);padding:10px 12px;font-size:14px;line-height:1.7}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:6px;padding:12px 18px;font-weight:900;font-size:16px;background:var(--ok);color:#06231b}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="hud">
    <div class="lvl"><b id="lvNo">No.1</b><span id="lvName">騎樓入門</span></div>
    <div class="stats">
      <span>時間 <em id="sTime">0.0</em>s</span>
      <span id="sTipW">推冧 <em id="sTip">0</em></span>
    </div>
    <div class="tools">
      <button id="bCam">鏡頭：街景</button>
      <button id="bRetry">重來</button>
      <button id="bMenu">選關</button>
    </div>
  </div>
  <div id="chip">騎緊車</div>
  <div id="hint" hidden></div>
  <div id="toast" hidden></div>
  <div id="controls">
    <div id="joy" aria-label="搖桿"><div id="knob"></div></div>
    <div class="acts">
      <button class="act push" id="bGrab" disabled>推車</button>
      <button class="act main" id="bRide">落車</button>
    </div>
  </div>
  <div class="overlay" id="ov" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE, PI = Math.PI;
const HL = .925, HW = .36, WB = 1.25, AXO = .62, SLOT_D = 2.2;
const $ = id => document.getElementById(id);

// ---------- seeded random ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- levels ----------
// slots run along x (1 m each) from x=0, z from -2.2 (arcade side) to 0 (road edge). Road is z 0..8.
const LEVELS = [
  { name:'騎樓入門', n:12, target:6, empty:[2], need:null, start:{x:1.2,z:4,a:0}, par:45,
    tip:'騎到亮咗嘅格，車頭直入都得。停好之後撳「落車」，就算泊好。' },
  { name:'車頭向外', n:12, target:5, empty:[], need:PI/2, start:{x:10.5,z:4,a:PI}, par:70,
    tip:'台灣機車多數車頭向外泊。可以停定後向後拉搖桿，坐喺車上用腳踩倒後入格；或者落車用手推。' },
  { name:'借位擺正', n:12, target:7, empty:[], need:PI/2, start:{x:2,z:4,a:0}, par:110,
    adj:{6:{dx:.27,da:.24},8:{dx:-.26,da:-.22}},
    tip:'隔籬兩架泊到斜晒，食咗你個格。行入騎樓，喺車尾撳「拉車尾」，左右擺正佢哋。唔好推冧！' },
  { name:'夜市口', n:14, target:11, empty:[13], need:PI/2, start:{x:2,z:4,a:0}, par:140,
    adj:{10:{dx:.18,da:.12}}, extra:[{x:11.4,z:.9,a:.35}],
    tip:'有人將架車擺咗喺格口出面。推佢去最尾嗰個空格，唔好隨便丟喺路邊阻人。' },
  { name:'捷運站地獄', n:14, target:6, empty:[5], need:PI/2, start:{x:12,z:4,a:PI}, par:170,
    adj:{4:{dx:0,da:-.1},7:{dx:.06,da:.14}}, extra:[{x:6.0,z:-1.15,a:PI/2+.38}],
    tip:'有架車打斜泊，一架霸兩格。拉佢車尾擺正入左邊個格，騰返位俾自己。' },
];

// ---------- renderer / scene ----------
const canvas = $('gl');
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
scene.background = new T.Color('#0b0d14');
scene.fog = new T.Fog('#0b0d14', 22, 48);
const camera = new T.PerspectiveCamera(48, 1, .1, 120);
scene.add(new T.HemisphereLight(0x9aa8d0, 0x3a2c22, .75));
const sun = new T.DirectionalLight(0xc8d4ff, .55);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-14, right:14, top:12, bottom:-12, near:1, far:40 });
scene.add(sun); scene.add(sun.target);

const M = (c, r = .6, m = 0, e) => new T.MeshStandardMaterial({ color: c, roughness: r, metalness: m, emissive: e || 0x000000 });
const BASIC = c => new T.MeshBasicMaterial({ color: c });

// ---------- textures ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 4; return t;
}
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

// ---------- models ----------
const WHEEL_G = new T.CylinderGeometry(.2, .2, .11, 18); WHEEL_G.rotateX(PI / 2);
const darkM = M(0x18191d, .8), greyM = M(0x4c5058, .7), chromeM = M(0xc8ccd2, .3, .7), redL = M(0x550000, .4, 0, 0xff2a1a), headL = M(0xffffff, .3, 0, 0xfff1c8), plateM = M(0xf2f2ee, .5);
function box(w, h, d, m, x, y, z, parent) { const b = new T.Mesh(new T.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = true; parent.add(b); return b; }
function makeScooter(color) {
  const root = new T.Group(), inner = new T.Group(); root.add(inner);
  const body = M(color, .42, .15);
  const rw = new T.Mesh(WHEEL_G, darkM); rw.position.set(-.62, .2, 0); rw.castShadow = true; inner.add(rw);
  box(1.0, .12, .42, greyM, -.05, .3, 0, inner);
  box(.85, .42, .5, body, -.48, .56, 0, inner);
  box(.32, .22, .46, body, -.85, .5, 0, inner);
  box(.8, .12, .4, darkM, -.42, .83, 0, inner);
  box(.05, .08, .3, redL, -1.0, .58, 0, inner);
  box(.02, .12, .22, plateM, -1.02, .38, 0, inner);
  const shield = box(.14, .62, .58, body, .45, .62, 0, inner); shield.rotation.z = .28;
  const front = new T.Group(); front.position.set(.5, 0, 0); inner.add(front);
  const fw = new T.Mesh(WHEEL_G, darkM); fw.position.set(.15, .2, 0); fw.castShadow = true; front.add(fw);
  box(.32, .08, .17, body, .15, .43, 0, front);
  box(.05, .5, .05, chromeM, .1, .6, 0, front);
  box(.08, .3, .08, darkM, 0, .98, 0, front);
  box(.06, .06, .72, darkM, -.02, 1.1, 0, front);
  box(.22, .15, .32, body, .03, 1.12, 0, front);
  box(.04, .1, .18, headL, .15, 1.12, 0, front);
  for (const s of [-1, 1]) { box(.02, .2, .02, chromeM, -.04, 1.22, .3 * s, front); box(.03, .07, .11, chromeM, -.04, 1.33, .3 * s, front); }
  return { root, inner, front };
}
function makePerson() {
  const root = new T.Group();
  const jeans = M(0x2c3a5a, .8), shirt = M(0xe9e4d6, .8), skin = M(0xe0b896, .7), helmet = M(0xffc83d, .35, .1), visor = M(0x1d2a33, .2, .4);
  const legs = [];
  for (const s of [-1, 1]) { const hip = new T.Group(); hip.position.set(0, .8, .1 * s); root.add(hip); box(.15, .8, .15, jeans, 0, -.4, 0, hip); box(.24, .08, .14, darkM, .05, -.79, 0, hip); legs.push(hip); }
  box(.26, .6, .42, shirt, 0, 1.12, 0, root);
  const arms = [];
  for (const s of [-1, 1]) { const sh = new T.Group(); sh.position.set(0, 1.38, .26 * s); root.add(sh); box(.12, .58, .12, shirt, 0, -.27, 0, sh); box(.1, .1, .1, skin, 0, -.6, 0, sh); arms.push(sh); }
  const head = new T.Mesh(new T.SphereGeometry(.13, 16, 12), skin); head.position.y = 1.58; head.castShadow = true; root.add(head);
  const hm = new T.Mesh(new T.SphereGeometry(.165, 18, 12, 0, PI * 2, 0, PI * .55), helmet); hm.position.y = 1.6; hm.castShadow = true; root.add(hm);
  box(.04, .07, .26, visor, .14, 1.6, 0, root);
  return { root, legs, arms };
}

// ---------- geometry ----------
function poly(x, z, a, hl, hw) {
  const c = Math.cos(a), s = Math.sin(a);
  return [[x + c*hl - s*hw, z + s*hl + c*hw], [x + c*hl + s*hw, z + s*hl - c*hw], [x - c*hl + s*hw, z - s*hl - c*hw], [x - c*hl - s*hw, z - s*hl + c*hw]];
}
function scPoly(s, x = s.x, z = s.z, a = s.a) {
  if (!s.tipped) return poly(x, z, a, HL, HW);
  const k = .42 * s.fallDir; return poly(x - Math.sin(a) * k, z + Math.cos(a) * k, a, .95, .55);
}
const rectPoly = r => [[r.x, r.z], [r.x + r.w, r.z], [r.x + r.w, r.z + r.d], [r.x, r.z + r.d]];
function sat(A, B) {
  for (const P of [A, B]) for (let i = 0; i < P.length; i++) {
    const p = P[i], q = P[(i + 1) % P.length], ax = p[1] - q[1], az = q[0] - p[0];
    let a1 = 1e9, a2 = -1e9, b1 = 1e9, b2 = -1e9;
    for (const v of A) { const d = v[0]*ax + v[1]*az; if (d < a1) a1 = d; if (d > a2) a2 = d; }
    for (const v of B) { const d = v[0]*ax + v[1]*az; if (d < b1) b1 = d; if (d > b2) b2 = d; }
    if (a2 <= b1 + 1e-6 || b2 <= a1 + 1e-6) return false;
  }
  return true;
}
function circPoly(px, pz, r, P) {
  let pos = 0, neg = 0, md = 1e9;
  for (let i = 0; i < P.length; i++) {
    const [ax, az] = P[i], [bx, bz] = P[(i + 1) % P.length];
    const ex = bx - ax, ez = bz - az, cr = ex * (pz - az) - ez * (px - ax);
    if (cr > 0) pos++; else neg++;
    const t = Math.max(0, Math.min(1, ((px - ax) * ex + (pz - az) * ez) / (ex*ex + ez*ez)));
    md = Math.min(md, Math.hypot(px - ax - ex*t, pz - az - ez*t));
  }
  return pos === 0 || neg === 0 || md < r;
}
const wrap = a => { while (a > PI) a -= 2*PI; while (a < -PI) a += 2*PI; return a; };
const lat = s => [-Math.sin(s.a), Math.cos(s.a)];

// ---------- game state ----------
let lvIdx = 0, L = null, world = null, scooters = [], walls = [], own = null, player = null;
let mode = 'ride', phase = 'menu', grab = null, camMode = 'street';
let tElapsed = 0, started = false, tipped = 0, holdT = 0, blockT = 0, pending = [], toastT = 0;
let walkPh = 0, input = { x: 0, y: 0 }, lookYaw = 0, lookDrag = false, camYawS = 0, povBack = false;
const camPos = new T.Vector3(0, 8, 12), camLook = new T.Vector3();
let progress = {};
try { progress = JSON.parse(localStorage.getItem('jcg-progress') || '{}') || {}; } catch (e) {}
const saveProgress = () => { try { localStorage.setItem('jcg-progress', JSON.stringify(progress)); } catch (e) {} };

const COLORS = [0xe9e4d6, 0x2b2f38, 0x8a9099, 0xb8322b, 0x3b5d8f, 0xd8c39a, 0x5c6b4e, 0xf0f0f0, 0x6f3f6b, 0x8fb6c9, 0x1f4a44, 0xc96f2e];
const SHOPS = [['鹹酥雞', '#d93a2b'], ['珍珠奶茶', '#2f7d5b'], ['早餐店', '#e0a524'], ['機車行', '#2b5fa8'], ['藥局', '#2a9a6a'], ['滷味', '#b4442a'],
  ['雜貨店', '#7a4fa0'], ['麵線', '#c2862c'], ['便當', '#c73a5a'], ['五金行', '#3e6e8e'], ['彩券行', '#d24d2a'], ['水果行', '#5c9a2e']];

function buildLevel(i) {
  if (world) { scene.remove(world); world.traverse(o => { if (o.geometry && o.geometry !== WHEEL_G) o.geometry.dispose(); }); }
  lvIdx = i; L = LEVELS[i]; world = new T.Group(); scene.add(world);
  const n = L.n, rnd = rng(i * 131 + 7);
  const X0 = -4, X1 = n + 4, Z0 = -6.6, Z1 = 9.2, PX = 48;
  // ground
  const gTex = canvasTex((X1 - X0) * PX, (Z1 - Z0) * PX, (g, w, h) => {
    const X = x => (x - X0) * PX, Z = z => (z - Z0) * PX;

  }
  if (camMode === 'street') { const fz = Math.max(-2, Math.min(4, f.z)) * .7; want = new T.Vector3(f.x, 6.4 * k, fz + 7.6 * k); look = new T.Vector3(f.x, .2, fz - .8); }
  else { const k2 = Math.max(1, Math.min(1.9, .95 / asp)); want = new T.Vector3(f.x, 10.5 * k2, f.z + 1.4); look = new T.Vector3(f.x, 0, f.z); }
  const a = 1 - Math.exp(-dt * 5); camPos.lerp(want, a); camLook.lerp(look, a);
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.set(camLook.x - 6, 14, camLook.z + 8); sun.target.position.copy(camLook);
}
function applyCamVis() {
  if (world) world.userData.upper.forEach(o => o.visible = camMode !== 'top');
  $('bCam').textContent = '鏡頭：' + { street: '街景', top: '俯視', pov: '主視角' }[camMode];
  camera.fov = camMode === 'pov' ? Math.min(92, Math.max(62, 2 * Math.atan(Math.tan(41 * PI / 180) / (camera.aspect || 1)) * 180 / PI)) : 48; camera.near = camMode === 'pov' ? .05 : .1; camera.updateProjectionMatrix();
  if (camMode === 'pov' && player) camYawS = mode === 'ride' ? own.a : mode === 'push' ? grab.s.a : player.face;
}

// ---------- rules ----------
function inSlotIdx(s, tol = .08) {
  if (s.tipped) return -1;
  const P = scPoly(s);
  let mnx = 1e9, mxx = -1e9, mnz = 1e9, mxz = -1e9;
  for (const [x, z] of P) { mnx = Math.min(mnx, x); mxx = Math.max(mxx, x); mnz = Math.min(mnz, z); mxz = Math.max(mxz, z); }
  if (mnz < -SLOT_D - tol || mxz > tol) return -1;
  const k = Math.floor((mnx + mxx) / 2);
  return (mnx >= k - tol && mxx <= k + 1 + tol) ? k : -1;
}
function inTarget() {
  if (!own || own.tipped) return 'out';
  if (inSlotIdx(own, .03) !== L.target) return 'out';
  if (L.need != null && Math.abs(wrap(own.a - L.need)) > .25) return 'dir';
  return 'in';
}

// ---------- mirrors: each renders a live rear view into a texture, shown flipped like real glass ----------
const mirrorScene = new T.Scene(), mirrorCam = new T.OrthographicCamera(0, 1, 0, -1, -10, 10);
function makeMirror(fov, aspect) {
  const rt = new T.WebGLRenderTarget(256, 160);
  const cam = new T.PerspectiveCamera(fov, aspect, .1, 80);
  const tex = rt.texture; tex.repeat.set(-1, 1); tex.offset.set(1, 0);
  const frame = new T.Mesh(new T.PlaneGeometry(1, 1), new T.MeshBasicMaterial({ color: 0x111316, depthTest: false }));
  const glass = new T.Mesh(new T.PlaneGeometry(1, 1), new T.MeshBasicMaterial({ map: tex, depthTest: false }));
  glass.renderOrder = 1; mirrorScene.add(frame); mirrorScene.add(glass);
  return { rt, cam, frame, glass, rect: null };
}
function placeMirror(m, x, y, w, h, border) {
  m.rect = { x, y, w, h };
  m.frame.scale.set(w + border * 2, h + border * 2, 1); m.frame.position.set(x + w / 2, -(y + h / 2), 0);
  m.glass.scale.set(w, h, 1); m.glass.position.set(x + w / 2, -(y + h / 2), 1);
  const dpr = renderer.getPixelRatio(); m.rt.setSize(Math.max(64, Math.round(w * dpr)), Math.max(32, Math.round(h * dpr)));
  m.cam.aspect = w / h; m.cam.updateProjectionMatrix();
}
function aimMirror(m, px, py, pz, tx, ty, tz) { m.cam.position.set(px, py, pz); m.cam.lookAt(tx, ty, tz); }
function drawMirrors(list, w, h) {
  for (const m of list) { renderer.setRenderTarget(m.rt); renderer.clear(); renderer.render(scene, m.cam); }
  renderer.setRenderTarget(null); renderer.setViewport(0, 0, w, h);
  mirrorScene.children.forEach(o => o.visible = false);
  list.forEach(m => { m.frame.visible = m.glass.visible = true; });
  mirrorCam.left = 0; mirrorCam.right = w; mirrorCam.top = 0; mirrorCam.bottom = -h; mirrorCam.updateProjectionMatrix();
  renderer.autoClear = false; renderer.clearDepth(); renderer.render(mirrorScene, mirrorCam); renderer.autoClear = true;
}
const mirL = makeMirror(28, 1.45), mirR = makeMirror(28, 1.45);
function scooterMirrors() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!(camMode === 'pov' && mode === 'ride' && phase === 'play')) return;
  const c = Math.cos(own.a), s = Math.sin(own.a), lx = -s, lz = c;
  const at = (fx, rx, y) => [own.x + c * fx + lx * rx, y, own.z + s * fx + lz * rx];
  let p = at(.46, -.34, 1.36), t = at(-10, -1.6, .5); aimMirror(mirL, ...p, ...t);
  p = at(.46, .34, 1.36); t = at(-10, 1.6, .5); aimMirror(mirR, ...p, ...t);
  drawMirrors([mirL, mirR], w, h);
}
// ---------- UI ----------
function syncUI() {
  const rb = $('bRide');
  if (mode === 'ride') { rb.textContent = '落車'; rb.disabled = false; }
  else { rb.textContent = '上車'; rb.disabled = !canMount(); }
  const gb = $('bGrab');
  if (grab) { gb.textContent = '放手'; gb.disabled = false; }
  else { const g = nearestGrab(); gb.disabled = !g; gb.textContent = !g ? '推車' : g.kind === 'lift' ? '扶起' : g.kind === 'rear' ? '拉車尾' : '推車頭'; }
  $('chip').textContent = mode === 'ride' ? '騎緊車' : mode === 'push' ? (grab.kind === 'rear' ? '拉緊車尾' : '推緊車頭') + (grab.s === own ? '（自己架）' : '（人哋架）') : '行路';
}
function hintText(st) {
  if (st === 'in' && mode !== 'ride' && !grab) return ['泊好，停定…', true];
  if (st === 'in' && mode === 'ride') return ['入咗格，撳「落車」', true];
  if (st === 'in' && grab) return ['入咗格，撳「放手」', true];
  if (st === 'dir') return ['入咗格，但車頭要向外（向住馬路）', false];
  if (mode === 'push') return [grab.kind === 'rear' ? '搖桿推去邊，車尾就擺去邊；前後推就前後移' : '搖桿推去邊，車就向嗰邊推，可以轉車頭', false];
  if (mode === 'ride' && !started) return ['用搖桿揸車，推去邊就去邊。停定再向後拉，就用腳踩倒後', false];
  return null;
}
function updateHUD(dt) {
  $('sTime').textContent = tElapsed.toFixed(1);
  $('sTip').textContent = tipped; $('sTipW').classList.toggle('bad', tipped > 0);
  syncUI();
  const h = hintText(inTarget()), el = $('hint');
  if (h) { el.hidden = false; el.textContent = h[0]; el.classList.toggle('good', h[1]); } else el.hidden = true;
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
}
function layout() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); if (world) applyCamVis();
  const hb = $('hud').getBoundingClientRect().bottom - $('app').getBoundingClientRect().top;
  const ct = $('controls').getBoundingClientRect().top - $('app').getBoundingClientRect().top;
  $('chip').style.top = (hb - 8) + 'px';
  $('hint').style.top = Math.max(hb + 22, ct - 48) + 'px';
  const sw = Math.min(150, w * .3), sh = sw * .68;
  placeMirror(mirL, 12, hb + 34, sw, sh, 4); placeMirror(mirR, w - sw - 12, hb + 34, sw, sh, 4);
}

// ---------- end ----------
const starStr = n => '★'.repeat(n) + '<s>' + '★'.repeat(3 - n) + '</s>';
function win() {
  phase = 'clear'; chime();
  const blocking = scooters.filter(s => s !== own && inSlotIdx(s) < 0).length;
  const pen = tipped + blocking, n = pen === 0 && tElapsed <= L.par ? 3 : pen <= 1 ? 2 : 1;
  const key = 'L' + lvIdx; progress[key] = Math.max(progress[key] || 0, n); saveProgress();
  const next = lvIdx + 1 < LEVELS.length;
  showOverlay(`<div class="card res"><h2>泊好！</h2><div class="big">${starStr(n)}</div>
    <dl><dt>關卡</dt><dd>No.${lvIdx + 1} ${L.name}</dd><dt>時間</dt><dd>${tElapsed.toFixed(1)} s（標準 ${L.par} s）</dd>
    <dt>推冧</dt><dd>${tipped} 架</dd><dt>出咗格阻人</dt><dd>${blocking} 架</dd></dl>
    <p class="help" style="margin:0">三星：冇推冧車、人哋架車全部留喺格入面、喺標準時間內。</p>
    <div class="btns">${next ? '<button class="btn" data-act="next">下一關</button>' : ''}<button class="btn ${next ? 'ghost' : ''}" data-act="retry">再泊一次</button><button class="btn ghost" data-act="menu">選關</button></div></div>`);
}
function showMenu() {
  phase = 'menu';
  const cards = LEVELS.map((lv, i) => { const open = i === 0 || progress['L' + (i - 1)]; return `<button class="lv" data-lv="${i}" ${open ? '' : 'disabled'}><span class="no">No.${i + 1}</span><span class="nm">${lv.name}</span><span class="st">${open ? starStr(progress['L' + i] || 0) : '未解鎖'}</span></button>`; }).join('');
  showOverlay(`<div class="card"><div class="brand"><div class="slots"></div><h1>機車格<i>地獄</i></h1>
    <p>台灣街頭騎樓前嘅機車格，一架貼一架。機車可以用腳踩慢慢倒後，窄到唔得就要落車用手推；隔籬泊斜咗，就要幫人擺正。推冧人哋架車會扣分。</p></div>
    <div class="levels">${cards}</div>
    <div class="help">手機：左下搖桿推去邊就去邊。右下「落車／上車」同「推車」。行到車頭旁邊撳就推車頭，行到車尾後面撳就拉車尾。<br>
    <a class="xlink" href="../">← 返主頁揀香港／台灣</a><br>鍵盤：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向鍵移動、<kbd>F</kbd> 上落車、<kbd>E</kbd> 推車／放手、<kbd>V</kbd> 換鏡頭（街景／俯視／主視角，主視角可以拖畫面四圍望）、<kbd>R</kbd> 重來。</div></div>`);
}
function showIntro() {
  phase = 'intro';
  showOverlay(`<div class="card res"><div class="brand"><div class="slots"></div></div><h2>No.${lvIdx + 1} ${L.name}</h2><p class="tip">${L.tip}</p>
    <div class="btns"><button class="btn" data-act="go">出發</button><button class="btn ghost" data-act="menu">選關</button></div></div>`);
}
function showOverlay(html) { const o = $('ov'); o.innerHTML = html; o.hidden = false; }
$('ov').addEventListener('click', e => {
  audio(); const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lv != null) { buildLevel(+b.dataset.lv); showIntro(); return; }
  const a = b.dataset.act;
  if (a === 'go') { $('ov').hidden = true; phase = 'play'; }
  if (a === 'retry') { buildLevel(lvIdx); $('ov').hidden = true; phase = 'play'; }
  if (a === 'next') { buildLevel(lvIdx + 1); showIntro(); }
  if (a === 'menu') showMenu();
});

// ---------- audio ----------
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function thud() {
  if (!ac) return;
  const n = ac.sampleRate * .35, buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = .5; src.buffer = buf; src.connect(f).connect(g).connect(ac.destination); src.start();
}
function chime() {
  if (!ac) return;
  [660, 880, 1320].forEach((fr, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = fr;
    const t0 = ac.currentTime + i * .1; g.gain.setValueAtTime(.08, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + .4); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + .45); });
}

// ---------- input ----------
const keys = {};
{
  const joy = $('joy'), knob = $('knob'); let pid = null;
  const setJ = e => { const r = joy.getBoundingClientRect(), R = r.width / 2; let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R; const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    input.x = x; input.y = -y; knob.style.transform = `translate(${x * R * .55}px,${y * R * .55}px)`; };
  joy.addEventListener('pointerdown', e => { e.preventDefault(); audio(); pid = e.pointerId; joy.setPointerCapture(pid); setJ(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === pid) setJ(e); });
  const end = () => { pid = null; input.x = 0; input.y = 0; knob.style.transform = ''; };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end); joy.addEventListener('lostpointercapture', end);
}
$('bRide').addEventListener('click', toggleRide);
$('bGrab').addEventListener('click', toggleGrab);
$('bCam').addEventListener('click', () => { camMode = { street: 'top', top: 'pov', pov: 'street' }[camMode]; applyCamVis(); });
{ // drag on the 3D view to look around in first-person
  let pid = null, lx = 0;
  canvas.addEventListener('pointerdown', e => { if (camMode !== 'pov') return; pid = e.pointerId; lx = e.clientX; lookDrag = true; canvas.setPointerCapture(pid); });
  canvas.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; lookYaw = Math.max(-2.4, Math.min(2.4, lookYaw + (e.clientX - lx) * .008)); lx = e.clientX; });
  const end = () => { pid = null; lookDrag = false; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
}
$('bRetry').addEventListener('click', () => { if (!L) return; buildLevel(lvIdx); $('ov').hidden = true; phase = 'play'; });
$('bMenu').addEventListener('click', showMenu);
function keyInput() {
  const x = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const y = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  if (x || y) { input.x = x; input.y = y; input.kb = true; } else if (input.kb) { input.x = 0; input.y = 0; input.kb = false; }
}
window.addEventListener('keydown', e => {
  audio(); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); keys[e.code] = true;
  if (phase !== 'play' || e.repeat) return;
  if (e.code === 'KeyF' || e.code === 'Space') toggleRide();
  if (e.code === 'KeyE') toggleGrab();
  if (e.code === 'KeyV') $('bCam').click();
  if (e.code === 'KeyR') $('bRetry').click();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; input.x = input.y = 0; });
window.addEventListener('resize', layout);

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  keyInput();
  if (L && phase === 'play') {
    for (let i = 0; i < 3; i++) step(dt / 3);
    if (started) tElapsed += dt;
    updateHUD(dt);
    if (inTarget() === 'in' && mode !== 'ride' && !grab) { holdT += dt; if (holdT > .6) win(); } else holdT = 0;
  }
  if (L) { syncMeshes(dt, now); renderer.render(scene, camera); scooterMirrors(); }
  requestAnimationFrame(frame);
}

const boot = () => { layout(); buildLevel(0); showMenu(); layout(); requestAnimationFrame(frame); };
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(boot);
})();
</script>
</body>
</html>
