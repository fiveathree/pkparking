<html lang="zh-Hant">
<head>

<style>
:root{--bg:#0d0f13;--panel:#151820;--line:#262b36;--ink:#ece8df;--dim:#8a8f9c;--brand:#7c6cff;--brand2:#b6adff;--warn:#ff5d5d;--ok:#4fd1a5;--gold:#f2c53d;
  --font:'Noto Sans TC',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 290px;height:100dvh}
#top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap;overflow:hidden}
#top .logo{font-weight:900;font-size:17px;color:var(--brand2);text-decoration:none}
#top .stat{font-family:var(--mono);display:flex;gap:5px;align-items:center}
#top .stat b{font-weight:700}
#top .sp{flex:1}
.speed{display:flex;gap:2px}
.speed button{padding:3px 8px;font-family:var(--mono);font-size:12px;border-radius:6px}
.speed button.on{background:var(--brand);border-color:var(--brand);color:#fff}
#map{grid-column:1;background:#11141a}
#side{grid-column:2;background:var(--panel);border-left:1px solid var(--line);padding:12px;font-size:13px;display:flex;flex-direction:column;gap:12px;min-height:0}
#side h3{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.06em;margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-family:var(--mono)}
.kv span:nth-child(odd){font-family:var(--font);color:var(--dim)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
#crew{flex:1;min-height:0;display:flex;flex-direction:column}
#crewList{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:3px}
.cr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;background:#1a1e27}
.cr .st{color:var(--dim);font-size:12px}
.cr .bar{grid-column:2/4;height:3px;background:#2a2f3b;border-radius:2px;overflow:hidden}
.cr .bar i{display:block;height:100%;background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--dim)}
#bottom{grid-column:1/-1;display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;align-items:center}
#bottom label{font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center;white-space:nowrap}
select{font:inherit;font-size:13px;color:var(--ink);background:#1f2430;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#1f2430;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--brand)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;border-radius:50%;font-size:11px;font-weight:700;color:var(--dim);background:transparent;border:1px solid var(--line);font-family:var(--mono)}
#pop{position:fixed;z-index:1100;width:300px;max-width:calc(100vw - 24px);background:#1b1f29;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#pop[hidden]{display:none}
/* dark map without another tile source: dim + invert the standard OSM tiles */
.leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) brightness(.85) contrast(.9) saturate(.6)}
.leaflet-container{font-family:var(--font);background:#11141a}
.leaflet-control-attribution{background:rgba(13,15,19,.75)!important;color:var(--dim)!important}
.leaflet-control-attribution a{color:var(--brand2)!important}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,15,19,.86);z-index:1000;padding:16px}
#overlay[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(380px,100%);text-align:center}
.card h2{font-size:20px;margin-bottom:8px}
.card p{color:var(--dim);font-size:14px;margin-bottom:14px;line-height:1.6}
.card table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 16px}
.card td{padding:5px 2px;border-bottom:1px solid var(--line);text-align:left}
.card td:last-child{text-align:right;font-family:var(--mono)}
.pos{color:var(--ok)}.neg{color:var(--warn)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#side .grip{display:none;width:100%;text-align:center;color:var(--dim);font-size:12px;cursor:pointer;padding-bottom:4px;background:none;border:0}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;right:0;bottom:52px;height:46dvh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:500;transform:translateY(calc(100% - 34px));transition:transform .25s}
  #side.open{transform:none}
  #side .grip{display:block}
  #top{gap:4px 10px;font-size:12px;padding:6px 10px;flex-wrap:wrap}
  #top .sp{display:none}
  #top .logo{font-size:15px}
  .hideS{display:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <a class="logo" href="../">外送風雲</a>
    <span class="stat hideS">📍<b id="tCity">高雄</b></span>
    <span class="stat"><b id="tDay">第 1 日</b> <b id="tClock">06:00</b></span>
    <span class="speed" id="speed"><button data-s="0">❚❚</button><button data-s="1" class="on">×1</button><button data-s="2">×2</button><button data-s="4">×4</button></span>
    <span class="sp"></span>
    <span class="stat">💰<b id="tMoney">0</b></span>

  </header>
  <div id="map"></div>
  <aside id="side">
    <button class="grip" id="grip">▲ 今日數字／外送員</button>
    <section>
      <h3>今日數字</h3>
      <div class="kv">
        <span>已送達</span><b id="sDone">0</b>
        <span>準時率</span><b id="sOnTime">–</b>
        <span>等緊人接</span><b id="sWait">0</b>
        <span>送緊</span><b id="sActive">0</b>
        <span>取消</span><b id="sCancel">0</b>
        <span>今日淨利</span><b id="sNet">0</b>
      </div>
    </section>
    <section id="crew">
      <h3>外送員 <span id="crewN"></span></h3>
      <div class="legend" id="legend"></div>
      <div id="crewList" style="margin-top:6px"></div>
    </section>
  </aside>
  <nav id="bottom">
    <label>平台抽成 <select id="comm"><option>15</option><option>20</option><option selected>25</option><option>30</option><option>35</option></select>%</label>
    <button class="info" data-info="comm">i</button>
    <span style="flex:1"></span>
    <button id="bReload" title="重新由 OpenStreetMap 抓地圖資料">重新抓地圖</button>
  </nav>
</div>
<div id="overlay"><div class="card" id="ovCard"><div class="spin"></div><h2>載入地圖中</h2><p>第一次開要由 OpenStreetMap 抓資料，大約十幾秒。</p></div></div>
<div id="pop" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ngraph.graph@20.0.1/dist/ngraph.graph.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ngraph.path@1.5.0/dist/ngraph.path.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- cities ----------
// bbox about 2 km x 2 km round the centre; cur = money symbol, k = price scale vs Taiwan
const CITIES = {
  khh: { name: '高雄', center: [22.6245, 120.3010], half: [0.009, 0.00975], cur: 'NT$', k: 1 },
};
let cityId = 'khh';

// ---------- map data: Overpass, cached 7 days ----------
const CACHE_DAYS = 7, MAP_VER = 1;
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const ROADS = 'trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|trunk_link|primary_link|secondary_link|tertiary_link';

function bboxOf(c) { const [la, lo] = c.center, [dla, dlo] = c.half; return [la - dla, lo - dlo, la + dla, lo + dlo]; }
function query(c) {
  const b = bboxOf(c).join(',');
  return `[out:json][timeout:90];way["highway"~"^(${ROADS})$"](${b});out geom qt;` +
    `(nwr["amenity"~"^(restaurant|fast_food|cafe)$"](${b});nwr["shop"~"^(supermarket|convenience)$"](${b});way["building"~"^(residential|apartments)$"](${b}););out center qt;`;
}
// compact form: N = flat [lat,lon,...] road nodes, W = road ways as node-index lists, P = places [lat,lon,kind,name], H = homes [lat,lon]
function compact(json) {
  const idx = new Map(), N = [], W = [], P = [], H = [];
  const r5 = v => Math.round(v * 1e5) / 1e5;
  for (const e of json.elements) {
    const t = e.tags || {};
    if (e.type === 'way' && t.highway && e.geometry) {
      const w = [];
      e.nodes.forEach((id, i) => {
        if (!idx.has(id)) { idx.set(id, N.length / 2); N.push(r5(e.geometry[i].lat), r5(e.geometry[i].lon)); }
        w.push(idx.get(id));
      });
      if (w.length > 1) W.push(w);
      continue;
    }
    const p = e.type === 'node' ? e : e.center; if (!p) continue;
    const kind = t.amenity || (t.shop ? 'shop' : null);
    if (kind) P.push([r5(p.lat), r5(p.lon), kind, t['name:zh'] || t.name || '']);
    else if (t.building) H.push([r5(p.lat), r5(p.lon)]);
  }
  return { v: MAP_VER, t: Date.now(), N, W, P, H };
}
async function fetchOverpass(c) {
  let err;
  for (const url of OVERPASS) {
    try {
      const r = await fetch(url, { method: 'POST', body: new URLSearchParams({ data: query(c) }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return compact(await r.json());
    } catch (e) { err = e; }
  }
  throw err;
}
const cacheKey = id => 'wsfy-map-' + id;
function readCache(id) { try { const d = JSON.parse(localStorage.getItem(cacheKey(id))); return d && d.v === MAP_VER ? d : null; } catch { return null; } }
function writeCache(id, d) { try { localStorage.setItem(cacheKey(id), JSON.stringify(d)); } catch {} }
async function loadCity(id, force) {
  const cached = readCache(id);
  if (cached && !force && Date.now() - cached.t < CACHE_DAYS * 864e5) return cached;
  try { const d = await fetchOverpass(CITIES[id]); writeCache(id, d); return d; }
  catch (e) { if (cached) return cached; throw e; }   // stale cache beats a blank screen
}

// ---------- road graph (metres, local flat projection) ----------
let G = null;   // { x, y, n, graph, finder, comp: node ids in the biggest connected piece }
function buildGraph(d) {
  const c = CITIES[cityId], lat0 = c.center[0], lon0 = c.center[1], kx = Math.cos(lat0 * Math.PI / 180) * 111320, ky = 110540;
  const n = d.N.length / 2, x = new Float64Array(n), y = new Float64Array(n), adj = Array.from({ length: n }, () => []);
  for (let i = 0; i < n; i++) { x[i] = (d.N[2 * i + 1] - lon0) * kx; y[i] = (d.N[2 * i] - lat0) * ky; }
  const graph = createGraph();
  for (const w of d.W) for (let i = 1; i < w.length; i++) {
    const a = w[i - 1], b = w[i]; if (a === b) continue;
    graph.addLink(a, b); adj[a].push(b); adj[b].push(a);
  }
  // keep only the biggest connected piece so every route exists
  const seen = new Int32Array(n).fill(-1); let best = [], k = 0;
  for (let s = 0; s < n; s++) {
    if (seen[s] >= 0 || !adj[s].length) continue;
    const q = [s]; seen[s] = k;
    for (let i = 0; i < q.length; i++) for (const m of adj[q[i]]) if (seen[m] < 0) { seen[m] = k; q.push(m); }
    if (q.length > best.length) best = q; k++;
  }
  const dist = (a, b) => Math.hypot(x[a.id] - x[b.id], y[a.id] - y[b.id]);
  const finder = ngraphPath.aStar(graph, { distance: dist, heuristic: dist });
  const toXY = (la, lo) => [(lo - lon0) * kx, (la - lat0) * ky];
  const toLL = (px, py) => [lat0 + py / ky, lon0 + px / kx];
  const snap = (px, py) => { let bi = best[0], bd = Infinity; for (const i of best) { const dd = (x[i] - px) ** 2 + (y[i] - py) ** 2; if (dd < bd) { bd = dd; bi = i; } } return bi; };
  G = { x, y, n, graph, finder, comp: best, toXY, toLL, snap };
}
// route between road nodes as a list of [x,y] points (ngraph returns target first)
function route(a, b) {
  if (a === b) return [[G.x[a], G.y[a]]];
  return G.finder.find(a, b).reverse().map(nd => [G.x[nd.id], G.y[nd.id]]);
}
const lenOf = pts => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return s; };

// ---------- map ----------
const map = L.map('map', { zoomControl: false, preferCanvas: true });
L.control.zoom({ position: 'topleft' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, minZoom: 13,
  attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' }).addTo(map);
const baseLayer = L.layerGroup().addTo(map), liveLayer = L.layerGroup().addTo(map);
const KIND = { restaurant: ['#ff9f43', '餐廳'], fast_food: ['#ffd166', '快餐'], cafe: ['#c08bff', '咖啡店'], shop: ['#4fd1a5', '超市／便利店'] };
const STATE = {
  idle: ['#4fd1a5', '等單'], toShop: ['#7c6cff', '去餐廳'], waitFood: ['#f2c53d', '等餐'], deliver: ['#ff9f43', '送緊'],
  back: ['#5aa9ff', '返回'], rest: ['#6b7080', '休息'],
};

// ---------- game state ----------
const DAY_START = 6 * 60, DAY_END = 26 * 60;       // 06:00 to 02:00 next day, in game minutes
const GMIN_PER_SEC = (DAY_END - DAY_START) / (8 * 60);   // one day ≈ 8 real minutes at ×1
const SPEED_MPM = 250;                              // courier average in town, metres per game minute (~15 km/h with lights)
const S = { day: 1, t: DAY_START, speed: 1, money: 20000, rating: 4.5, comm: 25, active: null, orders: [], couriers: [], today: null, nextId: 1 };
let places = [], homes = [];   // { ll:[lat,lon], node, kind, name, on }

const SUR = '陳林黃張李王吳劉蔡楊許鄭謝洪郭邱曾廖賴周';
const GIV = ['家豪', '志明', '俊傑', '建宏', '冠宇', '怡君', '雅婷', '佳穎', '宗翰', '承恩', '柏翰', '詩涵', '子軒', '品妤', '宇翔', '欣怡'];
function newCourier(node) {
  return { id: S.nextId++, name: pick(SUR) + pick(GIV), spd: rand(.85, 1.15), rel: rand(.9, 1), stam: rand(80, 100),
    st: 'idle', node, home: node, x: G.x[node], y: G.y[node], path: null, d: 0, order: null, restTo: 0, mk: null };
}

// orders per game hour across the whole map, before rating/places
function hourRate(h) {
  h %= 24;
  if (h >= 7 && h < 9) return 14;          // breakfast
  if (h >= 11.5 && h < 13.5) return 38;    // lunch
  if (h >= 15 && h < 16) return 12;        // afternoon tea
  if (h >= 17.5 && h < 20.5) return 45;    // dinner
  if (h >= 22 || h < 1) return 18;         // supper
  if (h >= 6 && h < 7) return 3;
  return 6;
}
function kindWeight(kind, h) {
  h %= 24;
  if (kind === 'fast_food') return 1.6;
  if (kind === 'cafe') return h >= 14 && h < 17 ? 2.2 : h < 10 ? 1.4 : h >= 17.5 ? .4 : 1;
  if (kind === 'restaurant') return (h >= 11 && h < 14) || (h >= 17 && h < 21) ? 1.3 : h < 10 ? .3 : 1;
  return .5;   // supermarket / convenience
}
const ratingMul = () => clamp((S.rating - 2) / 2.5, .25, 1.2);

function newDayStats() { return { done: 0, onTime: 0, late: 0, cancel: 0, revenue: 0, cost: 0, rating0: S.rating }; }

function spawnOrder() {
  const h = S.t / 60, open = places.filter(p => p.on);
  let tot = 0; for (const p of open) tot += kindWeight(p.kind, h);
  let r = Math.random() * tot, p = open[0];
  for (const q of open) { r -= kindWeight(q.kind, h); if (r <= 0) { p = q; break; } }
  // destination: a home 0.3–3 km away
  const px = G.x[p.node], py = G.y[p.node];
  let home = null;
  for (let i = 0; i < 30 && !home; i++) { const c = pick(homes), dd = Math.hypot(G.x[c.node] - px, G.y[c.node] - py); if (dd >= 300 && dd <= 3000) home = c; }
  if (!home) return;
  const km = Math.hypot(G.x[home.node] - px, G.y[home.node] - py) / 1000, k = CITIES[cityId].k;
  const prep = rand(5, 12), est = prep + km * 1300 / SPEED_MPM;
  S.orders.push({ id: S.nextId++, p, home, t0: S.t, ready: S.t + prep, due: S.t + Math.max(25, est + 15), km,
    food: Math.round(rand(120, 600) * k), fee: Math.round((30 + 10 * km) * k), pay: Math.round((45 + 10 * km) * k),
    st: 'wait', c: null, mk: null });
}

function setPath(c, toNode) { c.path = route(c.node, toNode); c.plen = lenOf(c.path); c.d = 0; c.target = toNode; }
function assign(o, c) { o.st = 'taken'; o.c = c; c.order = o; c.st = 'toShop'; setPath(c, o.p.node); }
function drop(c) {   // courier gives the order back; it goes to the queue again
  const o = c.order; o.st = 'wait'; o.c = null; c.order = null; c.st = 'back'; setPath(c, c.home);
}
function dispatch() {
  const free = S.couriers.filter(c => (c.st === 'idle' || c.st === 'back') && c.stam > 15);
  if (!free.length) return;
  for (const o of S.orders) {
    if (o.st !== 'wait' || !free.length) continue;
    const ox = G.x[o.p.node], oy = G.y[o.p.node];
    let bi = 0, bd = Infinity;
    free.forEach((c, i) => { const dd = Math.hypot(c.x - ox, c.y - oy); if (dd < bd) { bd = dd; bi = i; } });
    assign(o, free[bi]); free.splice(bi, 1);
  }
}

// walk along the current path; returns true on arrival
function move(c, gmin) {
  if (!c.path) return true;
  c.d = Math.min(c.plen, c.d + SPEED_MPM * c.spd * gmin);
  let left = c.d;
  for (let i = 1; i < c.path.length; i++) {
    const [ax, ay] = c.path[i - 1], [bx, by] = c.path[i], sl = Math.hypot(bx - ax, by - ay);
    if (left <= sl || i === c.path.length - 1) { const f = sl ? Math.min(1, left / sl) : 1; c.x = ax + (bx - ax) * f; c.y = ay + (by - ay) * f; break; }
    left -= sl;
  }
  if (c.d >= c.plen) { c.node = c.target; c.path = null; return true; }
  return false;
}

function finish(o, c) {
  const late = S.t > o.due, T = S.today;
  o.st = 'done'; T.done++;
  const rev = o.food * S.comm / 100 + o.fee, comp = late ? o.fee + 30 * CITIES[cityId].k : 0;
  T.revenue += rev; T.cost += o.pay + comp; S.money += rev - o.pay - comp;
  if (late) { T.late++; S.rating = clamp(S.rating - .012, 1, 5); } else { T.onTime++; S.rating = clamp(S.rating + .0015, 1, 5); }
  c.order = null;
}
function cancel(o) {
  o.st = 'cancel'; S.today.cancel++; S.rating = clamp(S.rating - .06, 1, 5);
  if (o.c) { o.c.order = null; if (o.c.st === 'toShop' || o.c.st === 'waitFood') { o.c.st = 'back'; setPath(o.c, o.c.home); } }
}

function step(gmin) {
  S.t += gmin;
  // new orders: expected count this slice, drawn one by one
  S.carry = (S.carry || 0) + hourRate(S.t / 60) * ratingMul() * (places.filter(p => p.on).length / Math.max(1, places.length)) * gmin / 60;
  while (S.carry >= 1) { S.carry--; spawnOrder(); }
  if (Math.random() < S.carry * .02) { S.carry = 0; spawnOrder(); }
  // customers give up on food that has not left the shop 15 min after the promised time
  for (const o of S.orders) if ((o.st === 'wait' || o.st === 'taken') && !o.picked && S.t > o.due + 15) cancel(o);
  dispatch();
  for (const c of S.couriers) {
    const busy = c.st !== 'idle' && c.st !== 'rest';
    c.stam = clamp(c.stam + (c.st === 'rest' ? 2 : busy ? -.35 : .2) * gmin, 0, 100);
    if (c.st === 'rest') { if (c.stam >= 80) c.st = 'idle'; continue; }
    if (c.st === 'toShop') { if (move(c, gmin)) { if (Math.random() > c.rel) drop(c); else c.st = 'waitFood'; } }
    else if (c.st === 'waitFood') { if (S.t >= c.order.ready) { c.st = 'deliver'; c.order.picked = true; setPath(c, c.order.home.node); } }
    else if (c.st === 'deliver') { if (move(c, gmin)) { finish(c.order, c); c.st = c.stam < 15 ? 'rest' : 'back'; if (c.st === 'back') setPath(c, c.home); } }
    else if (c.st === 'back') { if (move(c, gmin)) c.st = 'idle'; }
  }
  S.orders = S.orders.filter(o => o.st === 'wait' || o.st === 'taken' || (o.mk && (liveLayer.removeLayer(o.mk), o.mk = null)));
}

// ---------- drawing ----------
const hhmm = t => { const m = Math.floor(t) % (24 * 60); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const money = v => CITIES[cityId].cur + Math.round(v).toLocaleString('en-US');
function drawLive() {
  for (const c of S.couriers) {
    const ll = G.toLL(c.x, c.y), col = STATE[c.st][0];
    if (!c.mk) { c.mk = L.circleMarker(ll, { radius: 7, weight: 2.5, color: '#ffffff', fillOpacity: 1 }).addTo(liveLayer); c.mk.bindTooltip(''); }
    c.mk.setLatLng(ll); c.mk.setStyle({ fillColor: col }); c.mk.setTooltipContent(c.name + '・' + STATE[c.st][1]);
  }
  for (const o of S.orders) {
    const col = o.st === 'wait' ? '#ff5d5d' : '#ff9f43';
    if (!o.mk) o.mk = L.circleMarker(o.p.ll, { radius: 9, weight: 2, fill: false, interactive: false }).addTo(liveLayer);
    o.mk.setStyle({ color: col, opacity: o.st === 'wait' ? .95 : .35 });
  }
}
let lastUi = 0;
function drawUi(force) {
  const now = performance.now(); if (!force && now - lastUi < 250) return; lastUi = now;
  const T = S.today, wait = S.orders.filter(o => o.st === 'wait').length, act = S.orders.filter(o => o.st === 'taken').length;
  $('tDay').textContent = '第 ' + S.day + ' 日'; $('tClock').textContent = hhmm(S.t);
  $('tMoney').textContent = money(S.money); $('tRate').textContent = S.rating.toFixed(2);
  $('sDone').textContent = T.done; $('sOnTime').textContent = T.done ? Math.round(T.onTime / T.done * 100) + '%' : '–';
  $('sWait').textContent = wait; $('sActive').textContent = act; $('sCancel').textContent = T.cancel;
  $('sNet').textContent = money(T.revenue - T.cost);
  $('crewN').textContent = '（' + S.couriers.length + '）';
  $('crewList').innerHTML = S.couriers.map(c => `<div class="cr"><i class="dot" style="background:${STATE[c.st][0]}"></i><span>${c.name}</span><span class="st">${STATE[c.st][1]}</span><span class="bar"><i style="width:${c.stam}%;background:${c.stam < 25 ? 'var(--warn)' : 'var(--ok)'}"></i></span></div>`).join('');
}

// ---------- day flow ----------
function endDay() {
  S.speed = 0; markSpeed();
  for (const o of S.orders) if (o.st === 'wait' || o.st === 'taken') cancel(o);
  // restaurants react to the commission: above 25% some leave, at 20% or below some come back
  let left = 0, back = 0;
  for (const p of places) {
    if (p.on && S.comm > 25 && Math.random() < (S.comm - 25) * .015) { p.on = false; left++; }
    else if (!p.on && S.comm <= 20 && Math.random() < .05) { p.on = true; back++; }
  }
  const T = S.today, net = T.revenue - T.cost, dr = S.rating - T.rating0, cls = v => v >= 0 ? 'pos' : 'neg';
  overlay(`<h2>第 ${S.day} 日日結</h2><table>
    <tr><td>完成單數</td><td>${T.done}</td></tr>
    <tr><td>準時率</td><td>${T.done ? Math.round(T.onTime / T.done * 100) + '%' : '–'}</td></tr>
    <tr><td>取消</td><td>${T.cancel}</td></tr>
    <tr><td>收入</td><td>${money(T.revenue)}</td></tr>
    <tr><td>支出</td><td>${money(T.cost)}</td></tr>
    <tr><td>淨利</td><td class="${cls(net)}">${money(net)}</td></tr>
    <tr><td>評分變化</td><td class="${cls(dr)}">${(dr >= 0 ? '+' : '') + dr.toFixed(2)}（${S.rating.toFixed(2)}）</td></tr>
    ${left || back ? `<tr><td>餐廳變動</td><td>${back ? '+' + back + ' 加入 ' : ''}${left ? '−' + left + ' 退出' : ''}</td></tr>` : ''}
  </table><button class="pri" id="bNext">開始第 ${S.day + 1} 日</button>`);
  $('bNext').onclick = () => { S.day++; S.t = DAY_START; S.today = newDayStats(); S.orders.forEach(o => o.mk && liveLayer.removeLayer(o.mk)); S.orders = [];
    for (const c of S.couriers) { c.st = 'idle'; c.order = null; c.path = null; c.node = c.home; c.x = G.x[c.home]; c.y = G.y[c.home]; c.stam = 100; }
    overlay(''); S.speed = 1; markSpeed(); };
}

let last = 0;
function frame(now) {
  const dt = Math.min(.1, (now - (last || now)) / 1000); last = now;
  if (G && S.speed && $('overlay').hidden) {
    let g = dt * S.speed * GMIN_PER_SEC;
    while (g > 0) { const s = Math.min(.25, g); step(s); g -= s; if (S.t >= DAY_END) { endDay(); break; } }
    drawLive();
  }
  if (G) drawUi();
  requestAnimationFrame(frame);
}

// ---------- setup ----------
function setupWorld(d) {
  baseLayer.clearLayers(); liveLayer.clearLayers();
  const c = CITIES[cityId], b = bboxOf(c);
  map.setMaxBounds(L.latLngBounds([b[0] - .01, b[1] - .01], [b[2] + .01, b[3] + .01]));
  map.fitBounds([[b[0], b[1]], [b[2], b[3]]]);
  buildGraph(d);
  for (const w of d.W) baseLayer.addLayer(L.polyline(w.map(i => [d.N[2 * i], d.N[2 * i + 1]]), { color: '#3b4252', weight: 2, opacity: .6, interactive: false }));
  places = d.P.map(([la, lo, kind, name]) => ({ ll: [la, lo], node: G.snap(...G.toXY(la, lo)), kind, name, on: true }));
  homes = d.H.map(([la, lo]) => ({ ll: [la, lo], node: G.snap(...G.toXY(la, lo)) }));
  for (const p of places) {
    const m = L.circleMarker(p.ll, { radius: 3, color: KIND[p.kind][0], weight: 0, fillColor: KIND[p.kind][0], fillOpacity: .5 });
    m.bindTooltip((p.name || '（冇名）') + '・' + KIND[p.kind][1]); baseLayer.addLayer(m);
  }
  // starting crew: 8 couriers spread across the busiest road nodes
  S.couriers = []; S.orders = []; S.today = newDayStats();
  for (let i = 0; i < 8; i++) S.couriers.push(newCourier(pick(places).node));
  $('tCity').textContent = c.name;
  $('legend').innerHTML = Object.values(STATE).map(([col, n]) => `<span><i class="dot" style="background:${col}"></i>${n}</span>`).join('') + '<span><i class="dot" style="border:2px solid #ff5d5d"></i>冇人接</span>';
  drawLive(); drawUi(true);
}

function overlay(html) { $('ovCard').innerHTML = html; $('overlay').hidden = !html; }
async function start(force) {
  overlay('<div class="spin"></div><h2>載入地圖中</h2><p>第一次開要由 OpenStreetMap 抓資料，大約十幾秒。</p>');
  try { setupWorld(await loadCity(cityId, force)); overlay(''); }
  catch (e) {
    console.warn('map load failed', e);
    overlay('<h2>地圖載入失敗</h2><p>OpenStreetMap 資料暫時抓唔到，可能係網絡問題或者伺服器太忙。</p><button class="pri" id="bRetry">重試</button>');
    $('bRetry').onclick = () => start(force);
  }
}

function markSpeed() { document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('on', +b.dataset.s === S.speed)); }
$('speed').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.speed = +b.dataset.s; markSpeed(); };
$('comm').onchange = e => { S.comm = +e.target.value; };
$('bReload').onclick = () => start(true);
$('grip').onclick = () => $('side').classList.toggle('open');

// ⓘ popovers: fixed width, positioned near the button
const INFO = {
  comm: '平台由每張單嘅食物價錢抽呢個百分比。抽得高每單賺多啲，但抽成高過 25%，每日收工都會有餐廳退出平台，單量跟住跌；調返 20% 或以下，退出咗嘅餐廳會慢慢返嚟。',
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-info]'), pop = $('pop');
  if (!b) { if (!e.target.closest('#pop')) pop.hidden = true; return; }
  pop.textContent = INFO[b.dataset.info]; pop.hidden = false;
  const r = b.getBoundingClientRect();
  pop.style.left = clamp(r.left - 140, 12, innerWidth - pop.offsetWidth - 12) + 'px';
  pop.style.top = Math.max(12, r.top - pop.offsetHeight - 8) + 'px';
});

if (location.hash === "#dev") window.wsfy = { S, step, endDay, drawLive };   // test hook: fast-forward from the console
start(false);
requestAnimationFrame(frame);
})();
</script>
</body>
